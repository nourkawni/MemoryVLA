# static-fusion-arm-b1.yaml
#
# History-representation config for Arm B1 (cross_modal_gated_fusion_proposal.md,
# section 4.1: "B1 | g = [0.5, 0.5], fixed | Static fusion"). Loaded via
# b1_pi0.B1Config(history_config="static-fusion-arm-b1.yaml", ...) through
# mme_vla_suite.models.config.utils.get_history_config, same loader every other
# MME-VLA variant config uses. Field-for-field identical to Arm D's
# dynamic-fusion-arm-d.yaml EXCEPT integration_type -- B1 and D need the same
# budgets/feature dims because they must be comparable arms, differing only in
# how the two streams are combined.
#
# `budget` below is the PERCEPTUAL stream's budget (M_perc, 512 tokens) -- it feeds
# PerceptualMemory exactly as it does in the released perceptual-framesamp-modul.yaml
# this file otherwise mirrors. The SYMBOLIC stream's budget (~64 tokens, M_sym) is
# not a field in this file: it's B1Config.max_token_len (a top-level Python config
# field, defaulted to 64 by the base HistoryPi0Config already), same as Arm D.

budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16

pool_type: mean

use_pos_emb: true
use_state_emb: false

memory_feature:
  img:
    net: identity
    input_dim: 2048 # SigLIP feature dim, matches every other released config
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512

# Arm B1's fusion mechanism: proposal section 4.1 / arm_b1_static_fusion.models.
# history_gemma_static.StaticMemoryHistoryBlock only activates its static_fusion
# branch when integration_type == "static_fusion" -- the ONE line in this file
# that differs from Arm D's dynamic-fusion-arm-d.yaml.
integration_type: static_fusion
memory_token_dim: 1024 # width both streams are projected to before the modulator

# Not read by the released HistoryPi0 (which asserts representation_type in
# {"perceptual","recurrent","symbolic"}) -- only b1_pi0.B1Model recognizes
# this value, same as Arm D's ArmDModel does for the identical string.
representation_type: dual_symbolic_perceptual

perceptual_memory:
  type: frame_sampling # matches the released FrameSamp+Modul reference arm (Arm A) and Arm D

symbolic_memory:
  type: simple_subgoal # simple (ungrounded) subgoals; same choice Arm D's pilot uses, for a like-for-like comparison
