# hybrid-groundsg-prompt-framesamp-modul.yaml
#
# History config for the hybrid arm (hybrid_prompt_modul/):
#   - perceptual memory = FrameSamp + Modul. Every key from `budget` to `perceptual_memory` is
#     copied verbatim from the released
#     robomme_policy_learning/src/mme_vla_suite/models/config/robomme/perceptual-framesamp-modul.yaml,
#     so the released MemoryBuffer / PerceptualMemory / modulator code paths run unchanged.
#   - symbolic memory = the GroundSG caption written into the VLM prompt, exactly as the released
#     symbolic-grounded-subgoal variant does ("Task: ...;\nCurrent Subgoal: ...;\nAction: ").
#
# `symbolic_in_prompt` is read ONLY by this arm's own code (hybrid_pi0.py, hybrid_data_config.py,
# hybrid_dataset.py). The released code never looks at it, and `representation_type` stays
# "perceptual" so every released perceptual branch is taken.

budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling

symbolic_in_prompt:
  type: grounded_subgoal
