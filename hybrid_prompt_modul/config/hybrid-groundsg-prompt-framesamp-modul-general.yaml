# hybrid-groundsg-prompt-framesamp-modul-general.yaml
#
# Identical to hybrid-groundsg-prompt-framesamp-modul.yaml (same model, same memory settings) plus
# the caption_corruption block: the GENERAL, task-agnostic caption-corruption augmentation
# (training only, training/caption_corruption.py), 2026-10-07. Same rule for every task: ~20% of
# each episode's execution steps fall in 50-300-step windows that either HOLD a caption 1-3
# subgoals early/late for the whole window, or show NO caption. No content corruption, and
# target-naming captions are never altered, to keep caption-heavy tasks unaffected.

budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling

symbolic_in_prompt:
  type: grounded_subgoal

caption_corruption:
  enabled: true
  coverage: 0.20
  min_len: 50
  max_len: 300
  p_held_shift: 0.5
  p_dropout: 0.5
  max_shift: 3
  seed: 0
